name: App Android

# Compila el APK (la ventana de PokéSurvivor con el ayudante dentro) y lo publica en la versión
# «app-latest» del repositorio, con un enlace fijo para descargarlo desde el móvil:
#   https://github.com/Yeikoromeo2/Proyecto-PSG/releases/download/app-latest/PokeSurvivor-PSG.apk
on:
  push:
    paths:
      - 'android/**'
      - 'pokesurvivor-ayudante.user.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Llave de firma desde los Secrets del repositorio (nunca en el código):
      #   PSG_KEYSTORE_B64       el archivo .keystore en base64
      #   PSG_KEYSTORE_PASSWORD  su contraseña
      # Sin ellos se firma con una llave temporal (para actualizar habría que desinstalar antes).
      - name: Preparar la firma
        env:
          KS_B64: ${{ secrets.PSG_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PSG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/psg.keystore"
            echo "PSG_KEYSTORE=$RUNNER_TEMP/psg.keystore" >> "$GITHUB_ENV"
            echo "PSG_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNED=fija" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin PSG_KEYSTORE_B64 / PSG_KEYSTORE_PASSWORD en los Secrets: firma temporal."
            echo "SIGNED=temporal" >> "$GITHUB_ENV"
          fi

      - name: Revisar (lint) y compilar
        working-directory: android
        run: ./gradlew --no-daemon lintRelease assembleRelease

      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PokeSurvivor-PSG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokeSurvivor-PSG
          path: PokeSurvivor-PSG.apk

      - name: Publicar en «app-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '@version' pokesurvivor-ayudante.user.js | awk '{print $3}')
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest PokeSurvivor-PSG.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "App Android · ayudante ${VERSION} · compilación ${GITHUB_RUN_NUMBER}" \
            --notes "PokéSurvivor PSG: la web oficial del juego en una ventana con el motor de Chrome del sistema y el ayudante ${VERSION} dentro. Firma ${SIGNED}$( [ "$SIGNED" = fija ] && echo ': se instala encima de la versión anterior.' || echo ': para actualizar, desinstala antes la versión anterior.') Instrucciones: android/README.md"
